name: Publish sing-box rules

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: write

concurrency:
  group: sing-box-rules-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Report runner image
        run: |
          grep PRETTY_NAME /etc/os-release
          uname -r

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.2"
          cache: true

      - name: Build artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run ./cmd/build-rules

      - name: Publish rule-set branches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/publish-branches.sh
          scripts/publish-branches.sh
